[toolchain]
anchor_version = "1.1.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
deploy_a_token_staking = "GVeXtwSWuSF9zhSBBzDGAusrSVrwKwfYTPuJL42NCnjQ"

[programs.devnet]
deploy_a_token_staking = "GVeXtwSWuSF9zhSBBzDGAusrSVrwKwfYTPuJL42NCnjQ"

[programs.mainnet]
deploy_a_token_staking = "GVeXtwSWuSF9zhSBBzDGAusrSVrwKwfYTPuJL42NCnjQ"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Surfpool is Anchor 1.0's default runner and is not installed here. `legacy`
# uses solana-test-validator, which is the real Agave runtime rather than an
# emulator. For a program that will hold other people's tokens, testing against
# the thing that actually runs it is worth the slower start-up.
#
#   anchor test --validator legacy
